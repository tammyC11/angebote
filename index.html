* { box-sizing: border-box; }
body { margin: 0; }

.price { font-size: 1.6rem; letter-spacing: -.04em; font-weight: 750; }

<script>

const storageKey = 'weekly-offers.favorites.v1';
const batchSize = 24;
const weekSelect = byId('week');
const search = byId('search');
const saved = byId('saved');
const grid = byId('grid');
const more = byId('more');
const dialog = byId('details');
const retailerButtons = [...document.querySelectorAll('[data-retailer]')];
const categoryFilters = byId('category-filters');
// our categories, in the order the buttons show them (names come with each offer)
const categoryOrder = ['meat', 'seafood', 'vegetables', 'fruits', 'eggs', 'bread', 'dairy',
  'sweets_snacks', 'pantry', 'instant_food', 'drinks', 'other'];
const categoryNames = new Map(offers.filter(offer => offer.categories).map(offer => [offer.category, offer.categories]));
const translations = {

    more: '顯示更多優惠', close: '關閉', preview: '即將開始',
    noImage: '沒有商品圖片', noPrice: '價格請見型錄', loyalty: '限 Lidl Plus 會員',
    appOnly: '限 EDEKA App', app: 'App 優惠價', from: '開始日期', until: '截止日期', valid: '優惠期間',
    source: '查看優惠來源', details: (name, store) => `查看 ${store} 的 ${name} 詳情`,
    favorite: name => `將 ${name} 加入收藏`, unfavorite: name => `從收藏移除 ${name}`,
    count: n => `${n} 項優惠`, empty: '沒有符合篩選條件的優惠。',
    emptySaved: '沒有符合篩選條件的收藏。',
    storage: '瀏覽器無法儲存收藏。重新載入頁面後，本次變更將會消失。'
  }
};
const languageKey = 'weekly-offers.language.v1';
const languageSelect = byId('language');
let language = 'de';
try {
  const stored = localStorage.getItem(languageKey);
  if (Object.hasOwn(translations, stored)) language = stored;
} catch {
  // German remains the default when storage is unavailable.
}
let t;
let euro;
let dates;
const berlinDate = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Berlin' }).format(new Date());
const date = value => dates.format(new Date(value + 'T00:00:00Z'));
const normalize = value => value.toLocaleLowerCase('de-DE').replaceAll('ß', 'ss')
  .normalize('NFD').replace(/\p{Diacritic}/gu, '');
const displayName = offer => offer.names?.[language] ?? offer.name;
const categoryName = key => categoryNames.get(key)?.[language] ?? key;
const searchIndex = new Map(offers.map(offer => [
  offer.id, normalize([offer.name, ...Object.values(offer.names ?? {}), offer.brand]
    .filter(Boolean).join(' '))
]));
let favorites = new Set();
let retailer = '';
let category = '';
let favoritesOnly = false;
let matches = [];
let shown = 0;
let detailOffer = null;
let detailTrigger = null;

function element(tag, className, content) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (content != null) node.textContent = content;
  return node;
}

function readFavorites(value) {
  const parsed = JSON.parse(value ?? '[]');
  return new Set(Array.isArray(parsed) ? parsed.filter(id => typeof id === 'string') : []);
}

try {
  favorites = readFavorites(localStorage.getItem(storageKey));
} catch {
  // The catalog can still run if browser storage is unavailable.
}

function updateHeart(button) {
  const offer = button.dataset.name;
  const active = favorites.has(button.dataset.favorite);
  button.setAttribute('aria-pressed', String(active));
  button.setAttribute('aria-label', (active ? t.unfavorite : t.favorite)(offer));
  button.textContent = active ? '♥' : '♡';
}

function syncHearts() {
  document.querySelectorAll('[data-favorite]').forEach(updateHeart);
}

function refreshFavorites() {
  syncHearts();
  if (favoritesOnly) render();
}

function toggleFavorite(id) {
  const activeButton = document.activeElement;
  if (favorites.has(id)) favorites.delete(id);
  else favorites.add(id);
  try {
    localStorage.setItem(storageKey, JSON.stringify([...favorites]));
    byId('storage-status').hidden = true;
  } catch {
    byId('storage-status').textContent = t.storage;
    byId('storage-status').hidden = false;
  }
  refreshFavorites();
  if (!activeButton.isConnected && !dialog.open) saved.focus();
}

function heart(offer) {
  const button = element('button', 'heart');
  button.type = 'button';
  button.dataset.favorite = offer.id;
  button.dataset.name = displayName(offer);
  updateHeart(button);
  button.addEventListener('click', () => toggleFavorite(offer.id));
  return button;
}

function media(offer, large) {
  const box = element('div', 'media');
  box.append(element('span', 'fallback', t.noImage));
  if (!offer.photo) {
    box.classList.add('missing');
    return box;
  }
  const image = element('img');
  image.alt = '';
  image.loading = large ? 'eager' : 'lazy';
  image.decoding = 'async';
  image.referrerPolicy = 'no-referrer';
  image.addEventListener('error', () => box.classList.add('missing'), { once: true });
  image.src = offer.photo;
  const [left, top, right, bottom] = offer.crop ?? [];
  const width = right - left;
  const height = bottom - top;
  if (width > 0 && height > 0) {
    const crop = element('div', 'crop');
    const ratio = offer.ratio * width / height;
    crop.style.setProperty('--ratio', ratio);
    crop.style.setProperty('--crop-width', (large ? 220 : 178) * ratio + 'px');
    image.style.width = 100 / width + '%';
    image.style.height = 100 / height + '%';
    image.style.left = -100 * left / width + '%';
    image.style.top = -100 * top / height + '%';
    crop.append(image);
    box.append(crop);
  } else {
    box.append(image);
  }
  return box;
}

function summary(offer, full = false) {
  const copy = element('div', 'copy');
  const heading = element('h2', '', displayName(offer));
  heading.lang = displayName(offer) === offer.name ? 'de' : language;
  if (full) heading.id = 'detail-title';
  const tags = element('div', 'tags');
  tags.append(element('span', 'store ' + offer.retailer, offer.store ?? retailers[offer.retailer]));
  if (offer.category) tags.append(element('span', 'category', categoryName(offer.category)));
  copy.append(tags, heading);
  if (offer.brand && normalize(offer.brand) !== normalize(offer.name)) copy.append(element('span', 'brand', offer.brand));

  const prices = element('div', 'prices');
  prices.append(offer.price == null
    ? element('span', 'price unknown', t.noPrice)
    : element('strong', 'price', euro.format(offer.price)));
  if (offer.originalPrice != null) prices.append(element('del', '', euro.format(offer.originalPrice)));
  if (offer.discount) prices.append(element('span', 'discount', offer.discount));
  copy.append(prices);
  if (offer.unit) copy.append(element('span', 'unit', offer.unit));

  const conditions = [];
  if (offer.loyalty) conditions.push(t.loyalty);
  if (offer.appOnly) conditions.push(t.appOnly);
  else if (offer.appPrice != null) conditions.push(t.app + ' ' + euro.format(offer.appPrice));
  if (offer.start > offer.week) conditions.push(t.from + ' ' + date(offer.start));
  if (offer.end && offer.end < offer.weekEnd) conditions.push(t.until + ' ' + date(offer.end));
  if (conditions.length) {
    const row = element('div', 'conditions');
    row.append(...conditions.map(condition => element('span', 'condition', condition)));
    copy.append(row);
  }
  return copy;
}

function openDetail(offer, trigger) {
  detailOffer = offer;
  detailTrigger = trigger;
  const copy = summary(offer, true);
  const datesLabel = [t.valid, date(offer.start), '–', date(offer.end)].join(' ');
  copy.append(element('p', 'validity', datesLabel));
  if (offer.badges?.length) copy.append(element('p', 'unit', offer.badges.join(' · ')));
  if (offer.detail) {
    const description = element('p', 'description', offer.detail);
    description.lang = 'de';
    copy.append(description);
  }
  if (offer.source && /^https?:\/\//i.test(offer.source)) {
    const link = element('a', 'source', t.source);
    link.href = offer.retailer === 'lidl' && offer.source.includes('endpoints.leaflets.schwarz')
      ? 'https://www.lidl.de/c/online-prospekte/s10005610'
      : offer.source;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    copy.append(link);
  }
  byId('detail-body').replaceChildren(media(offer, true), copy);
  byId('detail-favorite').replaceChildren(heart(offer));
  dialog.showModal();
  dialog.scrollTop = 0;
}

function card(offer) {
  const article = element('article', 'card');
  const open = element('button', 'open');
  open.type = 'button';
  open.dataset.offer = offer.id;
  open.setAttribute('aria-haspopup', 'dialog');
  open.setAttribute('aria-label', t.details(displayName(offer), offer.store ?? retailers[offer.retailer]));
  open.addEventListener('click', () => openDetail(offer, open));
  article.append(media(offer, false), summary(offer), open, heart(offer));
  return article;
}

function appendBatch(moveFocus = false) {
  const batch = matches.slice(shown, shown + batchSize).map(card);
  grid.append(...batch);
  shown += batch.length;
  more.hidden = shown >= matches.length;
  if (moveFocus) batch[0]?.querySelector('.open').focus();
}

function render() {
  const terms = normalize(search.value).trim().split(/\s+/).filter(Boolean);
  matches = offers.filter(offer =>
    offer.week === weekSelect.value &&
    (!retailer || offer.retailer === retailer) &&
    (!category || offer.category === category) &&
    (!favoritesOnly || favorites.has(offer.id)) &&
    terms.every(term => searchIndex.get(offer.id).includes(term))
  );
  byId('count').textContent = t.count(matches.length);
  retailerButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.retailer === retailer)));
  renderCategoryButtons();
  saved.setAttribute('aria-pressed', String(favoritesOnly));
  saved.textContent = '♡ ' + t.saved + ' (' + favorites.size + ')';
  grid.replaceChildren();
  shown = 0;
  appendBatch();
  if (!matches.length) grid.append(element('p', 'empty',
    favoritesOnly ? t.emptySaved : t.empty));
}

function renderCategoryButtons() {
  const counts = new Map();
  for (const offer of offers) {
    if (offer.week !== weekSelect.value || !offer.category) continue;
    if (!counts.has(offer.category)) counts.set(offer.category, 0);
    if (!retailer || offer.retailer === retailer) counts.set(offer.category, counts.get(offer.category) + 1);
  }
  const keys = ['', ...categoryOrder.filter(key => counts.has(key)),
    ...[...counts.keys()].filter(key => !categoryOrder.includes(key))];
  const existing = new Map([...categoryFilters.children].map(button => [button.dataset.category, button]));
  const buttons = keys.map(key => {
    let button = existing.get(key);
    if (!button) {
      button = element('button', 'pill');
      button.type = 'button';
      button.dataset.category = key;
      button.addEventListener('click', () => {
        category = key;
        update();
      });
    }
    const total = key ? counts.get(key) : [...counts.values()].reduce((sum, n) => sum + n, 0);
    button.replaceChildren(key ? categoryName(key) : t.allCategories, element('span', 'n', String(total)));
    button.setAttribute('aria-pressed', String(key === category));
    return button;
  });
  if (buttons.some((button, i) => categoryFilters.children[i] !== button) || categoryFilters.children.length !== buttons.length) {
    categoryFilters.replaceChildren(...buttons);
  }
  categoryFilters.hidden = counts.size === 0;
}

function readUrl() {
  const params = new URLSearchParams(location.search);
  const requestedWeek = params.get('week');
  weekSelect.value = weeks.has(requestedWeek) ? requestedWeek : [...weeks.keys()].sort().at(-1) ?? '';
  retailer = Object.hasOwn(retailers, params.get('market')) ? params.get('market') : '';
  category = categoryNames.has(params.get('cat')) ? params.get('cat') : '';
  search.value = params.get('q') ?? '';
  favoritesOnly = params.get('saved') === '1';
}

function update() {
  const url = new URL(location.href);
  for (const [key, value] of [['week', weekSelect.value], ['market', retailer], ['cat', category],
    ['q', search.value.trim()], ['saved', favoritesOnly ? '1' : '']]) {
    if (value) url.searchParams.set(key, value);
    else url.searchParams.delete(key);
  }
  try {
    history.replaceState(null, '', url);
  } catch {
    // Some browsers disallow changing the URL of a local file.
  }
  render();
}

function applyLanguage() {
  t = translations[language];
  euro = new Intl.NumberFormat(language, { style: 'currency', currency: 'EUR' });
  dates = new Intl.DateTimeFormat(language, { dateStyle: 'medium', timeZone: 'UTC' });
  document.documentElement.lang = language;
  document.title = t.title;
  languageSelect.value = language;
  byId('page-title').textContent = t.title;
  byId('week-label').textContent = t.week;
  byId('language-label').textContent = t.language;
  byId('search-label').textContent = t.search;
  search.placeholder = t.search;
  byId('filters').setAttribute('aria-label', t.filters);
  categoryFilters.setAttribute('aria-label', t.categoryFilters);
  retailerButtons[0].textContent = t.all;
  grid.setAttribute('aria-label', t.offers);
  more.textContent = t.more;
  dialog.querySelector('.close').textContent = t.close;
  byId('storage-status').textContent = t.storage;

  const selectedWeek = weekSelect.value;
  weekSelect.replaceChildren();
  for (const [start, end] of [...weeks].sort(([first], [second]) => second.localeCompare(first))) {
    const label = date(start) + ' – ' + date(end) + (start > berlinDate ? ' · ' + t.preview : '');
    const option = element('option', '', label);
    option.value = start;
    weekSelect.append(option);
  }
  if (weeks.has(selectedWeek)) weekSelect.value = selectedWeek;
}

languageSelect.addEventListener('change', () => {
  language = languageSelect.value;
  try {
    localStorage.setItem(languageKey, language);
  } catch {
    // The selected language still applies to this view.
  }
  applyLanguage();
  render();
});
weekSelect.addEventListener('change', update);
search.addEventListener('input', update);
retailerButtons.forEach(button => button.addEventListener('click', () => {
  retailer = button.dataset.retailer;
  update();
}));
saved.addEventListener('click', () => {
  favoritesOnly = !favoritesOnly;
  update();
});
more.addEventListener('click', () => appendBatch(true));
dialog.addEventListener('close', () => {
  const target = detailTrigger?.isConnected ? detailTrigger
    : [...grid.querySelectorAll('.open')].find(button => button.dataset.offer === detailOffer?.id);
  (target ?? saved).focus();
  detailOffer = null;
  detailTrigger = null;
});
window.addEventListener('storage', event => {
  if (event.key !== storageKey && event.key !== null) return;
  try {
    favorites = readFavorites(event.newValue);
    refreshFavorites();
  } catch {
    // Ignore malformed values from other tabs.
  }
});
window.addEventListener('popstate', () => { readUrl(); render(); });
applyLanguage();
readUrl();
render();
</script>
</body>
</html>
