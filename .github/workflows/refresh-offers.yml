name: Refresh offers

# Weekly data pipeline:
#   get-edeka-offers ┐
#   extract-flyer-lidl ├─ (in parallel) → translate-products → build-catalog → commit
#   get-aldi-offers  ┘
#
# Each job runs on its own runner, so the flyer JSON files travel between jobs as artifacts.
# The final job commits the refreshed data/ and catalog.js back to the branch.

on:
  schedule:
    # Sundays 18:00 UTC. ALDI and EDEKA already publish the coming week's flyer by Sunday.
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      lidl_flyer_url:
        description: "Lidl leaflet API URL (overrides the LIDL_FLYER_URL repository variable)"
        required: false
        type: string

# Never run two refreshes at once: they would both commit to the same files.
concurrency:
  group: refresh-offers
  cancel-in-progress: false

permissions:
  contents: read

env:
  EDEKA_STORE_URL: https://www.edeka.de/maerkte/034462/angebote/

jobs:
  get-edeka-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run get-edeka-offers -- "$EDEKA_STORE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: data-edeka
          path: data/edeka/
          if-no-files-found: error

  get-aldi-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run get-aldi-offers
      - uses: actions/upload-artifact@v4
        with:
          name: data-aldi
          path: data/aldi/
          if-no-files-found: error

  extract-flyer-lidl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The leaflet URL contains a per-week id, so it has to be updated every week
      # (Settings → Secrets and variables → Actions → Variables), or passed when run manually.
      FLYER_URL: ${{ inputs.lidl_flyer_url || vars.LIDL_FLYER_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check inputs
        run: |
          if [ -z "$FLYER_URL" ]; then
            echo "::error::Set the LIDL_FLYER_URL repository variable (or pass lidl_flyer_url when running manually)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run extract-flyer-lidl -- "$FLYER_URL" --pages 3
      - uses: actions/upload-artifact@v4
        with:
          name: data-lidl
          path: data/lidl/
          if-no-files-found: error

  translate-products:
    # Starts only when all three jobs above have succeeded.
    needs: [get-edeka-offers, get-aldi-offers, extract-flyer-lidl]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: data-edeka
          path: data/edeka
      - uses: actions/download-artifact@v4
        with:
          name: data-aldi
          path: data/aldi
      - uses: actions/download-artifact@v4
        with:
          name: data-lidl
          path: data/lidl
      - run: npm run translate-products -- data/edeka/*.json data/aldi/*.json data/lidl/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: data-translated
          path: data/
          if-no-files-found: error

  build-catalog:
    needs: translate-products
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the refreshed data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: data-translated
          path: data
      - run: npm run build-catalog
      - name: Commit and push
        run: |
          git add data catalog.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh offers ($(date -u +%Y-%m-%d))"
          git push
